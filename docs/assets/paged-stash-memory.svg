<text x="1031" y="427" class="white" text-anchor="middle">B</text>
<rect x="573" y="450" width="76" height="39" rx="4" fill="#6050a3" stroke="none"/>
<text x="611" y="475" class="white" text-anchor="middle">B</text>
<rect x="657" y="450" width="76" height="39" rx="4" fill="#6050a3" stroke="none"/>
<text x="695" y="475" class="white" text-anchor="middle">B</text>
<rect x="741" y="450" width="76" height="39" rx="4" fill="#b46c25" stroke="none"/>
<text x="779" y="475" class="white" text-anchor="middle">C</text>
<rect x="825" y="450" width="76" height="39" rx="4" fill="#b46c25" stroke="none"/>
<text x="863" y="475" class="white" text-anchor="middle">C</text>
<rect x="909" y="450" width="76" height="39" rx="4" fill="#e4e9f0" stroke="none"/>
<text x="947" y="475" class="small" text-anchor="middle">–</text>
<rect x="993" y="450" width="76" height="39" rx="4" fill="#e4e9f0" stroke="none"/>
<text x="1031" y="475" class="small" text-anchor="middle">–</text>
<text x="573" y="511" class="sub" text-anchor="start">Pages hold valid activations; free pages are reusable.</text>
<text x="573" y="540" class="sub" text-anchor="start">Page records locate each activation for backward.</text>
<rect x="28" y="586" width="1064" height="78" rx="8" fill="#edf3f8" stroke="none"/>
<text x="50" y="614" class="label" text-anchor="start">GPU metadata drives execution</text>
<text x="50" y="641" class="sub" text-anchor="start">Token counts select valid rows; page records track storage. Allocations and captured launches stay fixed.</text>
</svg>